[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balton-certmatcher"
version = "1.0.0"
description = "BALTON TRADING ASIA — автоматический подбор сертификатов соответствия для аптечных заказов"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "BALTON TRADING ASIA" }]
keywords = ["pharmacy", "certificates", "excel", "automation", "desktop"]

dependencies = [
    "customtkinter>=5.2.2",
    "pillow>=10.3.0",
    "pandas>=2.2.2",
    "openpyxl>=3.1.5",
    "PyMuPDF>=1.24.9",
    "rapidfuzz>=3.9.0",
    "numpy>=1.26.4",
    "python-dateutil>=2.9.0",
    "watchdog>=4.0.1",
]

[project.optional-dependencies]
ai = ["sentence-transformers>=3.0.1"]
dnd = ["tkinterdnd2>=0.4.2"]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "pyinstaller>=6.9.0",
    "pyinstaller-hooks-contrib>=2024.7",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
balton-certmatcher = "app.main:main"

[project.gui-scripts]
balton-certmatcher-gui = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/**/*"]

# --------------------------------------------------------------------------- #
# Black
# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",  # ruff-specific
    "D",    # pydocstyle
    "ANN",  # annotations
    "PTH",  # use pathlib
    "RET",  # return
    "ARG",  # unused arguments
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is allowed in a few generic helpers
    "B008",   # function call in default argument (used for DI defaults)
    "N818",   # exception naming convention
    # Кодовая база полностью локализована на русский язык: строки, докстроки
    # и комментарии закономерно набраны кириллицей. Правила ambiguous-unicode
    # калиброваны на латиноориентированные проекты и здесь дают тысячи ложных
    # срабатываний на обычный русский текст, а не на реальную путаницу символов.
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    # Многие подавления исключений в GUI-слое сопровождаются поясняющим
    # комментарием, почему сбой ожидаем (например, «виджет уже уничтожен») —
    # contextlib.suppress не даёт естественного места для такого пояснения.
    "SIM105", # suppressible-exception
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "ARG", "S101"]
"app/gui/*" = ["ARG002"]  # Tk callbacks receive unused event objects

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = ["^build/", "^dist/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "customtkinter.*",
    "fitz.*",
    "sentence_transformers.*",
    "tkinterdnd2.*",
    "watchdog.*",
    "PIL.*",
    "pandas.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# customtkinter не поставляет тайп-стабы, поэтому весь модуль имеет тип Any.
# В строгом режиме это заставляет mypy требовать явного `type: ignore` на
# КАЖДОМ классе виджета, наследующем CTkFrame/CTkToplevel/CTk (misc:
# «Class cannot subclass "X" (has type "Any")») — десятки мест без единой
# реальной пользы: стаб всё равно не проверяет содержимое CustomTkinter.
# Отключаем это одно правило только для GUI-слоя, остальная строгость
# (типы аргументов, возвращаемых значений, unused-ignore и т. д.) сохраняется.
module = "app.gui.*"
disallow_subclassing_any = false

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: тесты, требующие тяжёлых зависимостей (ML-модели)",
    "gui: тесты, требующие графической подсистемы",
]
